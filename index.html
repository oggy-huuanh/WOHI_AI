<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>

</head>
<body>

    <div id = "gameContainer">
        <h1 id = "snakeText">Snake</h1>
        <canvas id = gameCanvas  width="400"
                 height="400"></canvas>

        <p id="info"></p>
        <p id="highScore"></p>
        <div id = "gameover">
            <h1>GAME OVER :( !!!!</h1>
            <button id = "restart">Restart</button>
        </div>
    </div>





    <script>
        // ===== GAME SETUP =====

        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let lose = false;
        let color = "black";

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let rainbowMode = false;
        let hueNum = 0;
        let hScore = parseInt(localStorage.getItem('highScore')) || 0;
        document.getElementById("highScore").innerHTML = "High score: " + hScore;


        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = color;
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
            document.getElementById("info").innerHTML = "Score: "  + score;

        };
        drawGame();
        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat
        // to guide your work through each step.
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

        // Game logic:

        const rainbowRun = () =>{
            if (rainbowMode === true){
                hueNum = (hueNum + 1) % 360
                color = `hsl(${hueNum}, 100%, 50%)`;
            }
            else{
                color = "black";
            }
        }

        const highScoreRecord = () =>{
            if (score > hScore) {
                hScore = score;
                localStorage.setItem('highScore', String(hScore));
                document.getElementById("highScore").innerHTML ="Highscore: " + hScore;
            }
        }



        const moveSnake = () =>{
            snake.unshift({x: snake[0].x + direction.x, y: snake[0].y + direction.y});
            if (snake[0].x === food.x && snake[0].y === food.y){
                score = score + 1; food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            }
            else if(!(snake[0].x === food.x && snake[0].y === food.y)){
                snake.pop();
            }
        }

        const endGame = () =>{
            if ((snake[0].x >= tileCount || snake[0].y >= tileCount) || (snake[0].x < 0 || snake[0].y < 0)){
                snake.length = 0;
                lose = true;
            }
            for (let i = 1; i < snake.length; i++){
                if (snake[0].x === snake[i].x && snake[0].y === snake[i].y){
                    snake.length = 0;
                    lose = true;
                }
            }
        }

        const restartGame = () =>{
            lose = false;
            score = 0;
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            document.getElementById("gameCanvas").style.display = "block";
            document.getElementById("gameover").style.display = "none";
            tick_loop = setInterval(tick, 100);
        }

        const tick = () =>{
            moveSnake();
            drawGame();
            endGame();
            rainbowRun();
            highScoreRecord();
            if (lose === true){
                clearInterval(tick_loop);
                document.getElementById("gameover").style.display = "block";
                document.getElementById("gameCanvas").style.display = "none";
            }
        }
        document.getElementById("restart").addEventListener("click", restartGame);
        let tick_loop = setInterval(tick, 100);
        // controls
        document.addEventListener("keydown", (event) =>{
            if (((event.key === "ArrowUp" && direction.y !== 1) || (event.key === "ArrowDown" && direction.y !== -1) ) || ((event.key === "ArrowRight" && direction.x !== -1) || (event.key === "ArrowLeft" && direction.x !== 1))){
                if (event.key === "ArrowUp"){
                    direction.y = -1;
                    direction.x = 0;
                }
                if (event.key === "ArrowDown"){
                    direction.y = 1;
                    direction.x = 0;
                }
                if (event.key === "ArrowRight"){
                    direction.y = 0;
                    direction.x = 1;
                }
                if (event.key === "ArrowLeft"){
                    direction.y = 0;
                    direction.x = -1;
                }
            }
            if (event.key === "r"){
                rainbowMode = !rainbowMode;
            }
            }
        );

    </script>
</body>
</html>
